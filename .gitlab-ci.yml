stages:
  - test
  - integration

variables:
  NODE_ENV: test

unit-tests:
  stage: test
  image: node:20
  script:
    - node --version
    - npm ci
    - npm run test:unit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

integration-gitlab:
  stage: integration
  image: node:20
  script:
    - node --version
    - npm ci
    - npm run test:integration-gitlab
  variables:
    GITLAB_MAX_PAGES: "2"
    GITLAB_PER_PAGE: "20"
    GITLAB_HTTP_TRANSPORT: "curl"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
  allow_failure: true
